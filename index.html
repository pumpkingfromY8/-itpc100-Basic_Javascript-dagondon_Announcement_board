<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimpol Dagondon</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="announcement-container">
        <img style="width: 3rem; border-radius: 50%; display: block; margin: auto 47%;"
            src="https://scontent.fmnl4-2.fna.fbcdn.net/v/t39.99422-6/799983699_1978152929551648_2283829516933807956_n.png?stp=dst-jpg_tt6&cstp=mx2048x2048&ctp=s2048x2048&_nc_cat=102&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeEfxOzmk_0u0A1OSCTpSJOW-U9uTJaavEj5T25Mlpq8SFEr07DguarDQ6hAXdOMqnhXkx5HxSV9MIdZLXqQ-P8-&_nc_ohc=r9kTmOmyZN8Q7kNvwEGhD3V&_nc_oc=AdrCGmixWGNVjuX_725aY6U_jAUAAegkR4AcIMI3zRMVP-Wv8UXWxHZsZxTE3IAfUxk&_nc_zt=14&_nc_ht=scontent.fmnl4-2.fna&_nc_gid=uu-4U-6UJ0TZy6iuEyRijA&_nc_ss=7b2a8&oh=00_AQS2pS8XGrFjCRF3zNU6Qo-DoENVHhoB3own2fUUrDc6pA&oe=6B004A06"
            alt="">
        <h1> Asscat Announcement Board</h1>
        <p class="intro">Created by: Dimpol Dagondon</p>

        <div class="post-form">
            <label for="messageInput">Your announcement</label>
            <input type="text" id="messageInput" placeholder="Type your announcement here..." maxlength="200">
            <button id="postButton" type="button">Post Announcement</button>
        </div>

        <section class="announcement-area" aria-live="polite">
            <h2>Latest Announcement</h2>
            <div id="outputBox" class="output-box">
                Your announcement will appear here.
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
